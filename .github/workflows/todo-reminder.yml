name: Todo Reminder

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

jobs:
  trigger-reminder-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Call reminder scan API
        run: |
          curl -sS -X POST "https://www.jasonxyk.cn/api/reminders/run" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -w "\nHTTP %{http_code}\n"